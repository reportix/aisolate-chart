{{- if and .Values.platform.keycloak.enabled (not .Values.platform.keycloak.existingSecret) }}
# Keycloak's passwords: generated on the first install, kept on upgrades. The admin's bootstraps the master realm; the
# demo cast's, one each, are imported with them (platform.keycloak.demoUsers).
apiVersion: v1
kind: Secret
metadata:
  name: keycloak
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  {{- range $user := list "admin" "developer" "auditor" "jane" "john" }}
  {{ $user }}-password: {{ include "aisolate.keycloakSecret" (dict "key" (printf "%s-password" $user) "context" $) | b64enc | quote }}
  {{- end }}
{{- end }}
