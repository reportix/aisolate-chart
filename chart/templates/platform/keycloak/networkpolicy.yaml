{{- if .Values.platform.keycloak.enabled }}
# Inside the namespace's default-deny: the browsers reach Keycloak through the ingress controller; the backend and the
# airlock, tool server and discovery pods fetch its keys in-cluster. It reaches the DNS alone: its database is a file.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keycloak
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: keycloak
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- include "aisolate.ingressControllerIngress" (dict "port" 8080 "context" $) | nindent 4 }}
    - from:
        - podSelector:
            matchLabels:
              app: backend
        - podSelector:
            matchExpressions:
              - key: aisolate.dev/role
                operator: In
                values: [airlock, tool-server, discovery]
      ports:
        - port: 8080
          protocol: TCP
  egress:
    {{- include "aisolate.dnsEgress" . | nindent 4 }}
{{- end }}
