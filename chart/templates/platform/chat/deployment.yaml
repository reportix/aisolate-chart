{{- if .Values.platform.chat.enabled }}
# The AIsolate chat, the sample client: it reaches the airlock pods through the release host, as a customer's
# chat would. The image carries that URL from its build (NEXT_PUBLIC_AISOLATE_URL).
{{ include "aisolate.web" (dict "name" "chat" "replicas" .Values.platform.chat.replicas "image" .Values.platform.chat.image "resources" .Values.platform.chat.resources "hostAliases" .Values.platform.chat.hostAliases "cache" "/app/apps/chat/.next/cache" "context" $) }}
{{- end }}
