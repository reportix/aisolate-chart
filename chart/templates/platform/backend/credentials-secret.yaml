{{- if and (not .Values.headless) (not .Values.platform.credentials.existingSecret) }}
# The credentials key: generated on the first install, kept on upgrades; only the backend reads it, to seal typed API keys and passwords.
apiVersion: v1
kind: Secret
metadata:
  name: credentials-key
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  key: {{ include "aisolate.generated" (dict "root" $ "name" "credentials") | b64enc | quote }}
{{- end }}
