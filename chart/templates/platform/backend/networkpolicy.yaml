{{- if not .Values.headless }}
# Inside the namespace's default-deny: the ingress controller and the scraper reach the backend, the airlock and
# tool server pods its ingest port (audit lines, the airlock's code); it reaches the DNS, its database, the identity provider, the
# trace store and Prometheus when Monitoring has them, and the API server. The airlock and tool server pods keep the
# policies the controller renders.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: backend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- include "aisolate.ingressControllerIngress" (dict "port" 8080 "context" $) | nindent 4 }}
    {{- include "aisolate.scraperIngress" . | nindent 4 }}
    - from:
        - podSelector:
            matchLabels:
              aisolate.dev/role: airlock
        - podSelector:
            matchLabels:
              aisolate.dev/role: tool-server
      ports:
        - port: 8085
          protocol: TCP
  egress:
    {{- include "aisolate.dnsEgress" . | nindent 4 }}
    - to:
        - podSelector:
            matchLabels:
              app: db
      ports:
        - port: 5432
          protocol: TCP
    {{- with .Values.platform.identity.operators.egress }}{{ $_ := required "platform.identity.operators.egress.port is required" .port }}{{ $_ := include "aisolate.peer" . }}{{ end }}
    {{- with include "aisolate.identity.operators.egress" . | fromYaml }}
    - to:
{{ include "aisolate.policyPeer" . | indent 8 }}
      {{- with .port }}
      ports:
        - port: {{ . }}
          protocol: TCP
      {{- end }}
    {{- else }}
    # The identity provider outside the cluster: HTTPS to a public address.
    {{- include "aisolate.publicEgress" . | nindent 4 }}
    {{- end }}
    {{- /* Monitoring's stores, when named: the trace store's query API and Prometheus's HTTP API, each on its peer's port alone. */}}
    {{- range (list (dict "name" "tracing" "url" .Values.platform.tracing.queryUrl "peer" .Values.platform.tracing.egress) (dict "name" "metrics" "url" .Values.platform.metrics.queryUrl "peer" .Values.platform.metrics.egress)) }}
    {{- if .url }}
    {{- $peer := .peer | default dict }}
    {{- if not (or $peer.cidr $peer.namespaceSelector $peer.podSelector) }}
    {{- fail (printf "platform.%s.egress: required with platform.%s.queryUrl, the store's peer (namespaceSelector and podSelector, or cidr) and port" .name .name) }}
    {{- end }}
    # Monitoring's {{ .name }} store: that peer on that port alone.
    - to:
{{ include "aisolate.policyPeer" $peer | indent 8 }}
      ports:
        - port: {{ required (printf "platform.%s.egress.port: required with platform.%s.queryUrl" .name .name) $peer.port }}
          protocol: TCP
    {{- end }}
    {{- end }}
    {{- include "aisolate.apiServerEgress" . | nindent 4 }}
{{- end }}
