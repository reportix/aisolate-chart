{{- if and (not .Values.headless) (not .Values.platform.audit.existingSecret) }}
# The audit ingest key: generated on the first install, kept on upgrades; the controller and the backend read it.
apiVersion: v1
kind: Secret
metadata:
  name: audit-ingest
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  key: {{ include "aisolate.generated" (dict "root" $ "name" "audit") | b64enc | quote }}
{{- end }}
