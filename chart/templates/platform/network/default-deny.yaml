# Default deny for every pod of the data plane; each pod kind's own policy opens exactly its peers.
# The namespace's Pod Security labels (enforce=restricted) are the installer's: Helm does not manage
# the release namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: {{ .Release.Namespace }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
