# Discovery, the well-known documents and every chat path no airlock's rule matches (404), behind one
# Service. Every user's token reaches it, so it selects only the controller's discovery pods, which run no
# airlock's code, never an airlock pod.
{{ include "aisolate.service" (dict "name" "aisolate" "selector" (dict "aisolate.dev/role" "discovery") "ports" (list (dict "name" "http" "port" 8080 "protocol" "TCP")) "context" $) }}
