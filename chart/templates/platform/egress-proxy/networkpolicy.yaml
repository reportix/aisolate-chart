{{- if .Values.platform.egress.proxy.domains }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: egress-proxy
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      aisolate.dev/role: egress-proxy
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - port: 3128
          protocol: TCP
  egress:
    {{- include "aisolate.dnsEgress" . | nindent 4 }}
    {{- include "aisolate.publicEgress" . | nindent 4 }}
{{- end }}
