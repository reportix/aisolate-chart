{{- if and (not .Values.headless) (not .Values.persistence.postgres.existingSecret) }}
# The database password: generated on the first install, kept on upgrades; the backend and the database read it.
apiVersion: v1
kind: Secret
metadata:
  name: db
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  password: {{ include "aisolate.dbPassword" . | b64enc | quote }}
{{- end }}
