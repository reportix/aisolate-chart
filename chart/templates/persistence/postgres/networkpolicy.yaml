{{- if not .Values.headless }}
# Inside the namespace's default-deny: only the backend reaches the database, and the database reaches nothing.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: db
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: db
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: backend
      ports:
        - port: 5432
          protocol: TCP
  egress: []
{{- end }}
