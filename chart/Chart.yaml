apiVersion: v2
name: aisolate
description: >-
  AIsolate: governed model endpoints over the organisation's own databases. Installs the custom
  resource definitions (Space, Airlock), the controller that turns them into airlock
  pods and tool server pods, and the namespace policies; with headless=false also the AIsolate UI
  and its plane; with platform.chat.enabled the AIsolate chat; with platform.keycloak.enabled a Keycloak of its
  own with the two realms.
type: application
home: https://github.com/reportix/aisolate-charts
sources:
  - https://github.com/reportix/aisolate-charts
  - https://github.com/reportix/aisolate
annotations:
  artifacthub.io/license: AGPL-3.0-only
version: 0.2.0
appVersion: "0.1.0"
kubeVersion: ">=1.29.0-0"
keywords: [aisolate, airlock, llm, governance]
