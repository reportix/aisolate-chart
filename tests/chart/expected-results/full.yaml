egress\n        port: 3128\n        domains: [\"idp.example.com\"]\n    airlockPods:\n      replicas: 2\n      runtimeClassName: \"\"\n    scheduling:\n      nodeSelector: {\"pool\":\"robot\"}\n      tolerations: [{\"effect\":\"NoSchedule\",\"key\":\"pool\",\"operator\":\"Equal\",\"value\":\"robot\"}]\n    corsAllowedOrigins: \"\"\n    observability:\n      otlpEndpoint: \"http://otel-collector.monitoring.svc:4318\"\n    code:\n      url: \"http://backend.aisolate.svc:8085/v1/code\"\n    audit:\n      url: \"http://backend.aisolate.svc:8085/v1/audit/events\"\n      failClosed: true\n      stdout: true\n    resources:\n      airlock: {\"limits\":{\"cpu\":\"2\",\"ephemeral-storage\":\"4Gi\",\"memory\":\"1536Mi\"},\"requests\":{\"cpu\":\"250m\",\"ephemeral-storage\":\"256Mi\",\"memory\":\"768Mi\"}}\n      toolServer: {\"limits\":{\"cpu\":\"1\",\"ephemeral-storage\":\"4Gi\",\"memory\":\"1Gi\"},\"requests\":{\"cpu\":\"100m\",\"ephemeral-storage\":\"128Mi\",\"memory\":\"512Mi\"}}"
