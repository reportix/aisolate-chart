apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: db
  namespace: aisolate
spec:
  podSelector:
    matchLabels:
      app: db
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: backend
      ports:
        - port: 5432
          protocol: TCP
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend
  namespace: aisolate
spec:
  podSelector:
    matchLabels:
      app: backend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {"kubernetes.io/metadata.name": "ingress-nginx"}
      ports:
        - port: 8080
          protocol: TCP
    - from:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              aisolate.dev/scraper: "true"
      ports:
        - port: 9464
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              aisolate.dev/role: airlock
        - podSelector:
            matchLabels:
              aisolate.dev/role: tool-server
      ports:
        - port: 8085
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {"kubernetes.io/metadata.name": "kube-system"}
          podSelector:
            matchLabels: {"k8s-app": "kube-dns"}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app: db
      ports:
        - port: 5432
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels: {"kubernetes.io/metadata.name": "aisolate"}
          podSelector:
            matchLabels: {"app": "keycloak"}
      ports:
        - port: 8080
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels: {"kubernetes.io/metadata.name": "monitoring"}
          podSelector:
            matchLabels: {"app": "jaeger"}
      ports:
        - port: 16686
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels: {"kubernetes.io/metadata.name": "monitoring"}
          podSelector:
            matchLabels: {"app": "prometheus"}
      ports:
        - port: 9090
          protocol: TCP
    - ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
        - port: 8443
          protocol: TCP
      to:
        - ipBlock:
            cidr: "10.0.0.1/32"
---
apiVersion: networking.k8s.io/v1
