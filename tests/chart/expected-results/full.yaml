apiVersion: apps/v1
kind: Deployment
metadata:
  name: egress-proxy
  namespace: aisolate
  labels:
    aisolate.dev/role: egress-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      aisolate.dev/role: egress-proxy
  template:
    metadata:
      labels:
        aisolate.dev/role: egress-proxy
      annotations:
        aisolate.dev/envoy-yaml: "static_resources:\n  listeners:\n    - name: proxy\n      address:\n        socket_address: {address: 0.0.0.0, port_value: 3128}\n      filter_chains:\n        - filters:\n            - name: envoy.filters.network.http_connection_manager\n              typed_config:\n                \"@type\": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager\n                stat_prefix: egress\n                upgrade_configs:\n                  - upgrade_type: CONNECT\n                access_log:\n                  - name: envoy.access_loggers.stdout\n                    typed_config:\n                      \"@type\": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog\n                http_filters:\n                  - name: envoy.filters.http.dynamic_forward_proxy\n                    typed_config:\n                      \"@type\": type.googleapis.com/envoy.extensions.filters.http.dynamic_forward_proxy.v3.FilterConfig\n                      dns_cache_config: {\"dns_lookup_family\":\"V4_ONLY\",\"name\":\"egress\",\"typed_dns_resolver_config\":{\"name\":\"envoy.network.dns_resolver.cares\",\"typed_config\":{\"@type\":\"type.googleapis.com/envoy.extensions.network.dns_resolver.cares.v3.CaresDnsResolverConfig\",\"dns_resolver_options\":{\"no_default_search_domain\":true}}}}\n                  - name: envoy.filters.http.router\n                    typed_config:\n                      \"@type\": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router\n                route_config:\n                  virtual_hosts:\n                    - name: allowed\n                      domains: [\"idp.example.com:443\"]\n                      routes:\n                        - match: {connect_matcher: {}}\n                          route:\n                            cluster: egress\n                            timeout: 0s\n                            upgrade_configs:\n                              - upgrade_type: CONNECT\n                                connect_config: {}\n                        - match: {prefix: /}\n                          direct_response: {status: 403}\n                    - name: refused\n                      domains: [\"*\"]\n                      routes:\n                        - match: {connect_matcher: {}}\n                          direct_response: {status: 403}\n                        - match: {prefix: /}\n                          direct_response: {status: 403}\n  clusters:\n    - name: egress\n      lb_policy: CLUSTER_PROVIDED\n      cluster_type:\n        name: envoy.clusters.dynamic_forward_proxy\n        typed_config:\n          \"@type\": type.googleapis.com/envoy.extensions.clusters.dynamic_forward_proxy.v3.ClusterConfig\n          dns_cache_config: {\"dns_lookup_family\":\"V4_ONLY\",\"name\":\"egress\",\"typed_dns_resolver_config\":{\"name\":\"envoy.network.dns_resolver.cares\",\"typed_config\":{\"@type\":\"type.googleapis.com/envoy.extensions.network.dns_resolver.cares.v3.CaresDnsResolverConfig\",\"dns_resolver_options\":{\"no_default_search_domain\":true}}}}\n"
    spec:
      nodeSelector:
        pool: robot
      tolerations:
        - effect: NoSchedule
          key: pool
          operator: Equal
          value: robot
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: registry-credentials
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: envoy
          image: envoyproxy/envoy@sha256:ccb37e93d8274a525fe00d67287716dbe3d58bc4237d7627af9e64fae0fd25c8
          imagePullPolicy: IfNotPresent
          args: ["-c", "/etc/envoy/envoy.yaml", "--disable-hot-restart"]
          ports:
            - containerPort: 3128
          readinessProbe:
            tcpSocket:
              port: 3128
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 1m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: conf
              mountPath: /etc/envoy
              readOnly: true
      volumes:
        - name: conf
          downwardAPI:
            items:
              - path: envoy.yaml
                fieldRef:
                  fieldPath: metadata.annotations['aisolate.dev/envoy-yaml']
