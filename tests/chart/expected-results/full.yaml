apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: aisolate
  labels:
    app: db
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
      annotations:
        checksum/db-password: "generated"
    spec:
      nodeSelector:
        pool: robot
      tolerations:
        - effect: NoSchedule
          key: pool
          operator: Equal
          value: robot
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: registry-credentials
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_DB
              value: aisolate
            - name: POSTGRES_USER
              value: aisolate
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db
                  key: password
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: [pg_isready, -U, aisolate, -d, aisolate]
            periodSeconds: 5
          resources:
            requests:
              cpu: 1m
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            - name: socket
              mountPath: /var/run/postgresql
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: db
        - name: socket
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: aisolate
  labels:
    app: backend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
      annotations:
        checksum/db-password: "generated"
        checksum/audit-ingest-key: "generated"
        checksum/credentials-key: "generated"
    spec:
      nodeSelector:
        pool: robot
      tolerations:
        - effect: NoSchedule
          key: pool
          operator: Equal
          value: robot
      serviceAccountName: backend
      imagePullSecrets:
        - name: registry-credentials
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: docker-public.sonatype.reportix.com/aisolate/backend@sha256:dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
          imagePullPolicy: IfNotPresent
          env:
            - name: AISOLATE_DB_URL
