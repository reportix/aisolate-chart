---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keycloak
  namespace: aisolate
spec:
  podSelector:
    matchLabels:
      app: keycloak
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {"kubernetes.io/metadata.name": "ingress-nginx"}
      ports:
        - port: 8080
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              app: backend
        - podSelector:
            matchExpressions:
              - key: aisolate.dev/role
                operator: In
                values: [airlock, tool-server, discovery]
      ports:
        - port: 8080
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {"kubernetes.io/metadata.name": "kube-system"}
          podSelector:
            matchLabels: {"k8s-app": "kube-dns"}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
