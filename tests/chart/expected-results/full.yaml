apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backend-apply
  namespace: aisolate
rules:
  - apiGroups: ["aisolate.dev"]
    resources: ["globals", "spaces", "airlocks"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aisolate-controller
  namespace: aisolate
rules:
  - apiGroups: ["aisolate.dev"]
    resources: ["globals", "spaces", "airlocks"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["aisolate.dev"]
    resources: ["globals/status", "spaces/status", "airlocks/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: [""]
    resources: ["services", "configmaps"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies", "ingresses"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backend-apply
  namespace: aisolate
roleRef:
  apiGroup: rbac.authorization.k8s.io
