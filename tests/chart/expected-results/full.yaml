r\"\n          ]\n        }\n      }\n    ]\n  },\n  \"roles\": {\n    \"realm\": [\n      {\n        \"name\": \"ceo\",\n        \"description\": \"May ask about every employee's records\"\n      },\n      {\n        \"name\": \"employee\",\n        \"description\": \"May ask about their own records\"\n      },\n      {\n        \"name\": \"auditor\",\n        \"description\": \"May ask every audited company's books\"\n      }\n    ]\n  },\n  \"users\": [\n    {\n      \"username\": \"jane\",\n      \"email\": \"jane@example.com\",\n      \"firstName\": \"Jane\",\n      \"lastName\": \"Doe\",\n      \"enabled\": true,\n      \"emailVerified\": true,\n      \"credentials\": [\n        {\n          \"type\": \"password\",\n          \"value\": \"${JANE_PASSWORD}\",\n          \"temporary\": false\n        }\n      ],\n      \"realmRoles\": [\n        \"ceo\"\n      ]\n    },\n    {\n      \"username\": \"john\",\n      \"email\": \"john@example.com\",\n      \"firstName\": \"John\",\n      \"lastName\": \"Doe\",\n      \"enabled\": true,\n      \"emailVerified\": true,\n      \"credentials\": [\n        {\n          \"type\": \"password\",\n          \"value\": \"${JOHN_PASSWORD}\",\n          \"temporary\": false\n        }\n      ],\n      \"realmRoles\": [\n        \"employee\"\n      ]\n    },\n    {\n      \"username\": \"auditor\",\n      \"email\": \"auditor@example.com\",\n      \"firstName\": \"Auditor\",\n      \"lastName\": \"Doe\",\n      \"enabled\": true,\n      \"emailVerified\": true,\n      \"credentials\": [\n        {\n          \"type\": \"password\",\n          \"value\": \"${AUDITOR_PASSWORD}\",\n          \"temporary\": false\n        }\n      ],\n      \"realmRoles\": [\n        \"auditor\"\n      ]\n    }\n  ]\n}\n"
