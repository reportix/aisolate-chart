apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aisolate-controller
  namespace: aisolate
spec:
  podSelector:
    matchLabels:
      aisolate.dev/role: controller
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              aisolate.dev/scraper: "true"
      ports:
        - port: 9464
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {"kubernetes.io/metadata.name": "kube-system"}
          podSelector:
            matchLabels: {"k8s-app": "kube-dns"}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
        - port: 8443
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: aisolate
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aisolate-controller
  namespace: aisolate
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aisolate-controller
  namespace: aisolate
rules:
  - apiGroups: ["aisolate.dev"]
    resources: ["globals", "spaces", "airlocks"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["aisolate.dev"]
    resources: ["globals/status", "spaces/status", "airlocks/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: [""]
    resources: ["services", "configmaps"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies", "ingresses"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aisolate-controller
  namespace: aisolate
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aisolate-controller
subjects:
  - kind: ServiceAccount
    name: aisolate-controller
    namespace: aisolate
---
apiVersion: v1
kind: Service
metadata:
  name: aisolate
  namespace: aisolate
spec:
  selector:
    aisolate.dev/role: discovery
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aisolate-controller
  namespace: aisolate
  labels:
    aisolate.dev/role: controller
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      aisolate.dev/role: controller
  template:
    metadata:
      labels:
        aisolate.dev/role: controller
      annotations:
        aisolate.dev/settings: "aisolate:\n  controller:\n    namespace: aisolate\n    ingress:\n      host: \"aisolate.example.com\"\n      className: \"nginx\"\n      publicUrl: \"https://aisolate.example.com\"\n    images:\n      airlock: aisolate/airlock@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb\n      toolServer: aisolate/tool-server@sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc\n      airlockPython: aisolate/airlock-python@sha256:9999999999999999999999999999999999999999999999999999999999999999\n      toolServerPython: aisolate/tool-server-python@sha256:8888888888888888888888888888888888888888888888888888888888888888\n      pullPolicy: IfNotPresent\n      allowTags: false\n    identity:\n      issuerUri: \"https://idp.example.com/realms/customer\"\n      jwkSetUri: \"\"\n      rolesClaim: \"realm_access.roles\"\n      egress:\n        \n    egress:\n      dns:\n        \n        namespaceSelector:\n          \"[kubernetes.io/metadata.name]\": \"kube-system\"\n        podSelector:\n          \"[k8s-app]\": \"kube-dns\"\n        port: 53\n      ingressFrom:\n        \n        namespaceSelector:\n          \"[kubernetes.io/metadata.name]\": \"ingress-nginx\"\n      hosts: {}\n      proxy:\n        enabled: false\n        host: egress\n        port: 3128\n        domains: []\n    airlockPods:\n      replicas: 1\n      runtimeClassName: \"\"\n    corsAllowedOrigins: \"\"\n    observability:\n      otlpEndpoint: \"\"\n    code:\n      url: \"\"\n    audit:\n      url: \"\"\n      failClosed: true\n      stdout: true\n    resources:\n      airlock: {\"limits\":{\"cpu\":\"2\",\"ephemeral-storage\":\"4Gi\",\"memory\":\"1536Mi\"},\"requests\":{\"cpu\":\"250m\",\"ephemeral-storage\":\"256Mi\",\"memory\":\"768Mi\"}}\n      toolServer: {\"limits\":{\"cpu\":\"1\",\"ephemeral-storage\":\"4Gi\",\"memory\":\"1Gi\"},\"requests\":{\"cpu\":\"100m\",\"ephemeral-storage\":\"128Mi\",\"memory\":\"512Mi\"}}"
    spec:
      serviceAccountName: aisolate-controller
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: aisolate/controller@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: http
              containerPort: 8082
            - name: management
              containerPort: 9464
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            initialDelaySeconds: 60
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: settings
              mountPath: /etc/aisolate
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: settings
          downwardAPI:
            items:
              - path: settings.yaml
                fieldRef:
                  fieldPath: metadata.annotations['aisolate.dev/settings']
        - name: tmp
          emptyDir: {}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aisolate
  namespace: aisolate
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
spec:
  ingressClassName: nginx
  rules:
    - host: aisolate.example.com
      http:
        paths:
          - path: /v1/airlocks
            pathType: Exact
            backend:
              service:
                name: aisolate
                port:
                  number: 8080
          - path: /v1/spaces/
            pathType: Prefix
            backend:
              service:
                name: aisolate
                port:
                  number: 8080
          - path: /.well-known/
            pathType: Prefix
            backend:
              service:
                name: aisolate
                port:
                  number: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aisolate-test
  namespace: aisolate
  annotations: {"helm.sh/hook": test, "helm.sh/hook-weight": "-5", "helm.sh/hook-delete-policy": "before-hook-creation,hook-succeeded,hook-failed"}
spec:
  podSelector:
    matchLabels: {aisolate.dev/role: test}
  policyTypes: [Egress]
  egress:
    - {}
---
apiVersion: v1
kind: Pod
metadata:
  name: aisolate-test-reachability
  namespace: aisolate
  labels: {aisolate.dev/role: test}
  annotations: {"helm.sh/hook": test, "helm.sh/hook-delete-policy": "before-hook-creation,hook-succeeded"}
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: probe
      image: curlimages/curl@sha256:9a1ed35addb45476afa911696297f8e115993df459278ed036182dd2cd22b67b
      imagePullPolicy: IfNotPresent
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: {drop: ["ALL"]}
      command: ["/bin/sh", "-ec"]
      args:
        - |
          ingress_ns="ingress-nginx"
          airlock_pod=unknown
          if [ -n "$ingress_ns" ]; then
            ingress="http://ingress-nginx-controller.$ingress_ns.svc.cluster.local"
            echo "positive: the release answers through the ingress controller (401 without a token proves the path)"
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 -H "Host: aisolate.example.com" "$ingress/v1/airlocks" || true)
            case "$code" in
              401) airlock_pod=yes ;;
              503) airlock_pod=no; echo "skipped: no discovery pod yet (503); rerun helm test once a Space exists" ;;
              *) echo "expected 401 through the ingress, got $code"; exit 1 ;;
            esac
          else
            echo "skipped: the ingress peer is a cidr, not a namespace; no positive probe from here"
          fi
          echo "negative: the discovery pods must be unreachable from a pod that is not the ingress controller"
          if curl -s -o /dev/null --max-time 5 http://aisolate:8080/actuator/health; then
            echo "FAIL: a discovery pod answered a pod in the namespace: the network policy is not enforced"; exit 1
          fi
          if [ "$airlock_pod" = no ]; then echo "skipped: no discovery pod to find unreachable"; else echo "ok: discovery pods unreachable"; fi
          for svc in ; do
            if getent hosts "$svc" >/dev/null 2>&1; then
              echo "negative: $svc must be unreachable from anything but its airlock's airlock pod"
              if curl -s -o /dev/null --max-time 5 "http://$svc:8081/actuator/health"; then
                echo "FAIL: $svc answered a pod that is not an airlock pod: the network policy is not enforced"; exit 1
              fi
              echo "ok: $svc unreachable"
            else
              echo "skipped: $svc not present (no airlock deployed yet)"
            fi
          done
          echo "reachability checks passed"
