apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: aisolate
  labels:
    app: db
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
      annotations:
        checksum/db-password: "generated"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_DB
              value: aisolate
            - name: POSTGRES_USER
              value: aisolate
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db
                  key: password
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: [pg_isready, -U, aisolate, -d, aisolate]
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            - name: socket
              mountPath: /var/run/postgresql
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: db
        - name: socket
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: aisolate
  labels:
    app: backend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
      annotations:
        checksum/db-password: "generated"
        checksum/audit-ingest-key: "generated"
        checksum/credentials-key: "generated"
    spec:
      serviceAccountName: backend
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: docker-public.sonatype.reportix.com/aisolate/backend@sha256:dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
          imagePullPolicy: IfNotPresent
          env:
            - name: AISOLATE_DB_URL
              value: "jdbc:postgresql://db:5432/aisolate"
            - name: AISOLATE_DB_USERNAME
              value: aisolate
            - name: AISOLATE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db
                  key: password
            - name: AISOLATE_ISSUER_URI
              value: "https://idp-ops.example.com/realms/aisolate"
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWKSETURI
              value: ""
            - name: AISOLATE_ROLES_CLAIM
              value: "realm_access.roles"
            - name: AISOLATE_PUBLIC_URL
              value: "https://aisolate.example.com"
            - name: AISOLATE_CORS_ALLOWED_ORIGINS
              value: "https://ui.aisolate.example.com"
            - name: AISOLATE_CLUSTER_NAMESPACE
              value: "aisolate"
            - name: AISOLATE_AUDIT_INGEST_KEY
              valueFrom:
                secretKeyRef:
                  name: audit-ingest
                  key: key
            - name: AISOLATE_CREDENTIALS_KEY
              valueFrom:
                secretKeyRef:
                  name: credentials-key
                  key: key
            - name: AISOLATE_AUDIT_INGEST_PORT
              value: "8085"
            - name: AISOLATE_AUDIT_RETENTION_MONTHS
              value: "84"
            - name: AISOLATE_TRACING_QUERY_URL
              value: "http://jaeger.monitoring.svc:16686"
            - name: AISOLATE_METRICS_QUERY_URL
              value: "http://prometheus.monitoring.svc:9090"
          ports:
            - name: http
              containerPort: 8080
            - name: ingest
              containerPort: 8085
            - name: management
              containerPort: 9464
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            initialDelaySeconds: 90
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aisolate-controller
  namespace: aisolate
  labels:
    aisolate.dev/role: controller
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      aisolate.dev/role: controller
  template:
    metadata:
      labels:
        aisolate.dev/role: controller
      annotations:
        aisolate.dev/settings: "aisolate:\n  controller:\n    namespace: aisolate\n    ingress:\n      host: \"aisolate.example.com\"\n      className: \"nginx\"\n      publicUrl: \"https://aisolate.example.com\"\n    images:\n      airlock: docker-public.sonatype.reportix.com/aisolate/airlock@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb\n      toolServer: docker-public.sonatype.reportix.com/aisolate/tool-server@sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc\n      airlockPython: docker-public.sonatype.reportix.com/aisolate/airlock-python@sha256:9999999999999999999999999999999999999999999999999999999999999999\n      toolServerPython: docker-public.sonatype.reportix.com/aisolate/tool-server-python@sha256:8888888888888888888888888888888888888888888888888888888888888888\n      pullPolicy: IfNotPresent\n      allowTags: false\n    identity:\n      issuerUri: \"https://idp.example.com/realms/customer\"\n      jwkSetUri: \"\"\n      rolesClaim: \"realm_access.roles\"\n      egress:\n        \n    egress:\n      dns:\n        \n        namespaceSelector:\n          \"[kubernetes.io/metadata.name]\": \"kube-system\"\n        podSelector:\n          \"[k8s-app]\": \"kube-dns\"\n        port: 53\n      ingressFrom:\n        \n        namespaceSelector:\n          \"[kubernetes.io/metadata.name]\": \"ingress-nginx\"\n      hosts: {}\n      proxy:\n        enabled: false\n        host: egress\n        port: 3128\n        domains: []\n    airlockPods:\n      replicas: 1\n      runtimeClassName: \"\"\n    scheduling:\n      nodeSelector: {}\n      tolerations: []\n    corsAllowedOrigins: \"\"\n    observability:\n      otlpEndpoint: \"\"\n    code:\n      url: \"http://backend.aisolate.svc:8085/v1/code\"\n    audit:\n      url: \"http://backend.aisolate.svc:8085/v1/audit/events\"\n      failClosed: true\n      stdout: true\n    resources:\n      airlock: {\"limits\":{\"cpu\":\"2\",\"ephemeral-storage\":\"4Gi\",\"memory\":\"1536Mi\"},\"requests\":{\"cpu\":\"250m\",\"ephemeral-storage\":\"256Mi\",\"memory\":\"768Mi\"}}\n      toolServer: {\"limits\":{\"cpu\":\"1\",\"ephemeral-storage\":\"4Gi\",\"memory\":\"1Gi\"},\"requests\":{\"cpu\":\"100m\",\"ephemeral-storage\":\"128Mi\",\"memory\":\"512Mi\"}}"
        checksum/audit-ingest-key: "generated"
    spec:
      serviceAccountName: aisolate-controller
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: docker-public.sonatype.reportix.com/aisolate/controller@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: AISOLATE_CONTROLLER_AUDIT_INGESTKEY
              valueFrom:
                secretKeyRef:
                  name: audit-ingest
                  key: key
          ports:
            - name: http
              containerPort: 8082
            - name: management
              containerPort: 9464
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            initialDelaySeconds: 60
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: settings
              mountPath: /etc/aisolate
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: settings
          downwardAPI:
            items:
              - path: settings.yaml
                fieldRef:
                  fieldPath: metadata.annotations['aisolate.dev/settings']
        - name: tmp
          emptyDir: {}
---
