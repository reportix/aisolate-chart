# test_render checks the chart on every push. Reportix's release component publishes it:
# every commit on main to helm-internal as <version>-<sha10>, a bare semver tag X.Y.Z equal to Chart.yaml's
# version to the world-readable helm-public after verify-release; verify-version makes every branch bump the
# version. chart_image_gate stays off, since it does not understand digest pins; verify-pins stands in for it.
include:
  - component: $CI_SERVER_FQDN/reportix/ci-templates/release@1
    inputs:
      image: docker-internal.sonatype.reportix.com/reportix/ci-images/generic:latest
      release_channel: public
      chart_names: aisolate
      declared_version_command: "yq '.version' chart/Chart.yaml"
      internal_publish_command: 'helm-publish.sh --chart-dir chart --version "$RESOLVED_VERSION" --on-conflict overwrite --repo-url https://sonatype.reportix.com/repository/helm-${PUBLISH_CHANNEL}'
      release_publish_command: 'helm-publish.sh --chart-dir chart --on-conflict fail --repo-url https://sonatype.reportix.com/repository/helm-${PUBLISH_CHANNEL}'
      version_gate: increase

stages: [test, publish-internal, publish-release]

.helm:
  # The fleet's generic image ships helm, yq, kubectl and docker.
  image: docker-internal.sonatype.reportix.com/reportix/ci-images/generic:latest

test_render:
  extends: .helm
  stage: test
  script:
    - ./tests/chart/test.sh
  artifacts:
    when: on_failure
    paths:
      - tests/chart/actual-results
    expire_in: 1 week

# A release tag publishes values.yaml as it stands: --check fails unless its digests are what the registry serves for
# Chart.yaml's appVersion, so neither an unpinned chart nor a hand-edited appVersion is published.
verify-pins:
  extends: .helm
  stage: test
  rules:
    - if: $CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/
  script:
    - scripts/pin-release.sh --check

# The chart end to end (tests/e2e/run.sh) on a kind cluster in the job's dind sidecar, with the app's snapshot images
# from docker-internal: AISOLATE_IMAGE_TAG is a <version>-<sha10> that aisolate/aisolate's main pipeline published.
# The runner's docker-login.sh gives the job's Docker the SONATYPE_* credentials; run.sh pulls the two images there and
# loads them into kind, so the cluster needs no pull Secret. Manual and allowed to fail until it has passed here.
# Before `when: manual` goes:
# - the runner proves that dind runs the kind node (privileged, cgroup v2) and publishes its API server on the pod's
#   127.0.0.1, which the job shares, and that the service memory below holds the node with Keycloak, the controller,
#   the airlock and discovery pods and ingress-nginx;
# - run.sh loads the curl, stub and Keycloak images as it loads the AIsolate ones (the node pulls them from Docker Hub
#   and quay.io anonymously), checks the ingress-nginx manifest's checksum and waits for its
#   ingress-nginx-admission-patch job;
# - ci-images ships kind, so the download below goes;
# - a default AISOLATE_IMAGE_TAG (or the chart's digests, once pinned) replaces the input.
test_deploy:
  stage: test
  image: docker-internal.sonatype.reportix.com/reportix/ci-images/generic:latest
  variables:
    AISOLATE_IMAGE_TAG: ""
    # A version bump changes the checksum: the release's kind-linux-amd64.sha256sum.
    KIND_VERSION: v0.33.0
    KIND_SHA256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
    # The kind node and its pods live in the dind sidecar: the runner's 2Gi service default would OOM it.
    KUBERNETES_SERVICE_MEMORY_REQUEST: 6Gi
    KUBERNETES_SERVICE_MEMORY_LIMIT: 8Gi
    KUBERNETES_SERVICE_CPU_REQUEST: "2"
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: manual
      allow_failure: true
  before_script:
    # As Skye's deploy jobs: a cluster's watchers exhaust the node's default inotify instances.
    - echo 1024 | tee /proc/sys/fs/inotify/max_user_instances
    - curl -fsSL -o /usr/local/bin/kind "https://github.com/kubernetes-sigs/kind/releases/download/$KIND_VERSION/kind-linux-amd64"
    - echo "$KIND_SHA256  /usr/local/bin/kind" | sha256sum -c -
    - chmod +x /usr/local/bin/kind
  script:
    - test -n "$AISOLATE_IMAGE_TAG" || { echo "set AISOLATE_IMAGE_TAG to a <version>-<sha10> of aisolate/aisolate's main pipeline" >&2; exit 1; }
    - tests/e2e/run.sh --images "docker-internal.sonatype.reportix.com/aisolate:$AISOLATE_IMAGE_TAG"
